<html>
  <head>
    <title>SandDog</title>
    <style>

      }

        background-color: #555;

        padding: 5px;
      }
      .controls__buttons {
        font-size: 0px;
      }
      .materials__buttons {
        margin-top: 5px;
        font-size: 0px;
      }
      label {
        color: white;
      }
      .info {
        color: white;
      }
      span {
        color: white;
      }
    </style>
  </head>

          for (let dx = -1; dx <= 1; dx++) {
            for (let dy = -1; dy <= 1; dy++) {
              if (dx === 0 && dy === 0) continue;
              const neighbor = getParticle(this._x + dx, this._y + dy);
              if (neighbor && neighbor._type === "Water") {
                replaceParticle(
                  this._x,
                  this._y,
                  new RockParticle(this._x, this._y, grid)
                );
                return false;
              }
            }
          }
          // Если рядом находится дерево, зажигаем его (заменяем дерево на огонь)
          for (let dx = -1; dx <= 1; dx++) {
            for (let dy = -1; dy <= 1; dy++) {
              if (dx === 0 && dy === 0) continue;
              if (isParticle(this._x + dx, this._y + dy, "Wood")) {
                replaceParticle(
                  this._x + dx,
                  this._y + dy,
                  new FireParticle(this._x + dx, this._y + dy, grid)
                );
              }
            }
          }
          // Сначала пытаемся двигаться вниз, затем диагональю, затем вбок.
          if (this.moveIfCan(0, 1)) return true;
          const dir = randi(0, 1) === 0 ? -1 : 1;
          if (this.moveIfCan(dir, 1)) return true;
          return this.moveIfCan(dir, 0);
        }
      );
      LavaParticle.prototype.density = 15;

      // Застывшая лава
      const RockParticle = defineParticleType(
        "Rock",
        "#5a4a42",
        () => ["#5a4a42", "#4d3f38", "#66554b"][randi(0, 2)],
        function () {
          // BUGFIX: rock is affected by gravity – if it is unsupported (e.g. the
          // lava beneath it cooled or moved away) it falls down instead of
          // floating in mid-air forever.
          if (!this.moveIfCan(0, 1)) {
            const dir = randi(0, 1) === 0 ? -1 : 1;
            return this.moveIfCan(dir, 1);
          }
          return true;
        }
      );
      RockParticle.prototype.density = 12;

      // Почва: ведёт себя как песок, но семена прорастают только на ней
      const SoilParticle = defineParticleType(
        "Soil",
        "#6b4a2b",
        () => ["#6b4a2b", "#5d3f24", "#795533"][randi(0, 2)],
        function () {
          if (!this.moveIfCan(0, 1)) {
            const dir = randi(0, 1) === 0 ? -1 : 1;
            return this.moveIfCan(dir, 1);
          }
          return true;
        }
      );
      SoilParticle.prototype.density = 11;
      const DarkEarthParticle = defineParticleType(
        "DarkEarth",
        "#3e2b18",
        () => ["#3e2b18", "#332414", "#48331d"][randi(0, 2)],
        function () {
          if (!this.moveIfCan(0, 1)) {
            const dir = randi(0, 1) === 0 ? -1 : 1;
            return this.moveIfCan(dir, 1);
          }
          return true;
        }
      );
      DarkEarthParticle.prototype.density = 11;

      // НОВЫЙ МАТЕРИАЛ: Семена (Seed) — падают, укореняются в земле и прорастают
      // в растущее дерево, которое со временем гаснет, оставляя бревно.
      const SproutParticle = defineParticleType(
        "Sprout",
        "#3fae4a",
        "#3fae4a",
        function () {
          this._growth ??= randi(40, 90);
          this._growth--;
          if (this._growth > 0) {
            // Растём вверх, иногда разбрасывая боковые ветки-листья.
            if (this.canMove(0, -1)) {
              placeParticle(
                this._x,
                this._y - 1,
                new SproutParticle(this._x, this._y - 1, grid)
              );
              this.markForRemoval();
              return false;
            }
            if (randi(1, 100) <= 12) {
              const dir = randi(0, 1) === 0 ? -1 : 1;
              if (this.canMove(dir, 0)) {
                placeParticle(
                  this._x + dir,
                  this._y,
                  new LeafParticle(this._x + dir, this._y, grid)
                );
              }
            }
            return true;
          }
          // Созрело в прочное бревно.
          replaceParticle(this._x, this._y, new WoodParticle(this._x, this._y, grid));
          return false;
        }
      );
      SproutParticle.prototype.static = true;
      const LeafParticle = defineParticleType(
        "Leaf",
        "#2e8b57",
        () => ["#2e8b57", "#3cb371", "#556b2f"][randi(0, 2)],
        function () {
          // Листья живут недолго и опадают, превращаясь в перегной (DarkEarth).
          this._life ??= randi(120, 400);
          this._life--;
          if (this._life <= 0) {
            replaceParticle(
              this._x,
              this._y,
              new DarkEarthParticle(this._x, this._y, grid)
            );
            return false;
          }
          // Иногда лист опадает вниз, если под ним свободно.
          const fallDir = randi(-1, 1);
          if (randi(1, 100) <= 3 && this.canMove(fallDir, 1)) {
            this.markForRemoval();
            placeParticle(
              this._x + fallDir,
              this._y + 1,
              new LeafParticle(this._x + fallDir, this._y + 1, grid)
            );
            return false;
          }
          return true;
        }
      );
      LeafParticle.prototype.static = true;
      const SeedParticle = defineParticleType(
        "Seed",
        "#d8c15c",
        "#d8c15c",
        function () {
          // Падает как песок.
          if (!this.moveIfCan(0, 1)) {
            const dir = randi(0, 1) === 0 ? -1 : 1;
            if (this.moveIfCan(dir, 1)) return true;
            // Прорастает, если снизу земля/перегной или семя лежит прямо на камне/дереве.
            const below = getParticle(this._x, this._y + 1);
            if (below && ["Sand", "DarkEarth", "Soil"].includes(below._type)) {
              replaceParticle(
                this._x,
                this._y,
                new SproutParticle(this._x, this._y, grid)
              );
              return false;
            }
            return false;
          }
          return true;
        }
      );
      SeedParticle.prototype.density = 9;

      let currentMaterial = SandParticle;
      const mouse = {
        isDown: false,
        button: 0,
        prevX: 0,
        prevY: 0,
        x: 0,
        y: 0,
      };
      canvas.addEventListener("mousedown", (event) => {
        const mx = Math.floor(event.offsetX / cellSize);
        const my = Math.floor(event.offsetY / cellSize);
        if (paused && event.button == 0) {
          // BUGFIX: inspect the cell under the *click* coordinates (mx/my), not
          // the stale mouse.x/y from the previous mousemove.
          const particle = getParticle(mx, my);
          if (particle) {
            tick++;
            console.log(particle);
            particle.wake();
            particle.update();
            ctx.putImageData(imageData, 0, 0);
          } else {
            // Left-click on empty space while paused paints with the current material.
            mouse.isDown = true;
            mouse.button = event.button;
            mouse.prevX = mx;
            mouse.prevY = my;
            mouse.x = mx;
            mouse.y = my;
          }
        } else if (paused && event.button == 2) {
          removeParticle(mx, my);
          ctx.putImageData(imageData, 0, 0);
        } else {
          mouse.isDown = true;
          mouse.button = event.button;
          mouse.prevX = mouse.x;
          mouse.prevY = mouse.y;
          mouse.x = mx;
          mouse.y = my;
        }
      });
      canvas.addEventListener("mousemove", (event) => {
        mouse.x = Math.floor(event.offsetX / cellSize);
        mouse.y = Math.floor(event.offsetY / cellSize);
      });
      canvas.addEventListener("mouseup", () => (mouse.isDown = false));
      // BUGFIX: releasing the button outside the canvas used to leave the brush
      // stuck down and keep painting forever.
      window.addEventListener("mouseup", () => (mouse.isDown = false));
      canvas.addEventListener("mouseleave", () => (mouse.isDown = false));
      canvas.addEventListener("contextmenu", (e) => e.preventDefault());
      document
        .getElementById("startButton")
        .addEventListener("click", () => (paused = false));
      document.getElementById("stepButton").addEventListener("click", () => {
        update();
        react();
      });
      document
        .getElementById("stopButton")
        .addEventListener("click", () => (paused = true));
      document
        .getElementById("debugRenderButton")
        .addEventListener("click", () => {
          for (let x = 0; x < gridWidth; x++) {
            for (let y = 0; y < gridHeight; y++) {
              if (grid[x][y]) {
                paintPixel(x, y, "white");
              }
            }
          }
          // BUGFIX: debug render didn't flush the buffer, so nothing appeared.
          ctx.putImageData(imageData, 0, 0);
        });
      document.getElementById("wakeAllButton").addEventListener("click", () => {
        for (let x = 0; x < gridWidth; x++) {
          for (let y = 0; y < gridHeight; y++) {
            if (grid[x][y]) {
              grid[x][y].wake();
              grid[x][y].update();
            }
          }
        }
      });
      document
        .getElementById("clearAllButton")
        .addEventListener("click", () => {
          for (let x = 0; x < gridWidth; x++) {
            for (let y = 0; y < gridHeight; y++) {
              grid[x][y] = null;
              paintPixel(x, y, "black");
            }
          }
          activeParticles.clear();
          ctx.putImageData(imageData, 0, 0);
        });

      const brushWidthValue = document.getElementById("brushWidthValue");
      document.getElementById("brushWidthSlider").value = brushWidth;
      brushWidthValue.innerText = brushWidth;
      document
        .getElementById("brushWidthSlider")
        .addEventListener("input", (e) => {
          brushWidth = parseInt(e.target.value);
          brushWidthValue.innerText = brushWidth;
        });
      const updateFrequencyValue = document.getElementById(
        "updateFrequencyValue"
      );
      document.getElementById("updateFrequencySlider").value = updateFrequency;
      updateFrequencyValue.innerText = updateFrequency;
      document
        .getElementById("updateFrequencySlider")
        .addEventListener("input", (e) => {
          updateFrequency = parseInt(e.target.value);
          updateFrequencyValue.innerText = updateFrequency;
        });

      const colorLookup = {};
      // BUGFIX: the external color-js library (CDN) could fail to load or throw
      // on CSS color names; parsing colors is now done locally with a fallback.
      const namedColorFallback = {
        black: [0, 0, 0],
        white: [255, 255, 255],
        red: [255, 0, 0],
        blue: [0, 0, 255],
        green: [0, 128, 0],
        yellow: [255, 255, 0],
        orange: [255, 165, 0],
        purple: [128, 0, 128],
        cyan: [0, 255, 255],
        gray: [128, 128, 128],
        grey: [128, 128, 128],
        brown: [165, 42, 42],
        pink: [255, 192, 203],
      };
      function parseColorToRgb(color) {
        try {
          if (typeof Color === "function") {
            const c = Color(color);
            return [
              Math.floor(c.getRed() * 255),
              Math.floor(c.getGreen() * 255),
              Math.floor(c.getBlue() * 255),
            ];
          }
        } catch (e) {
          /* fall through to local parsing */
        }
        if (typeof color === "string") {
          const name = color.trim().toLowerCase();
          if (namedColorFallback[name]) return namedColorFallback[name];
          if (name[0] === "#") {
            let hex = name.slice(1);
            if (hex.length === 3) {
              hex = hex
                .split("")
                .map((ch) => ch + ch)
                .join("");
            }
            const num = parseInt(hex, 16);
            if (!Number.isNaN(num)) {
              return [(num >> 16) & 255, (num >> 8) & 255, num & 255];
            }
          }
        }
        return [255, 0, 255]; // magenta = unknown color, easy to spot
      }
      function paintPixel(x, y, color) {
        if (x < 0 || x >= gridWidth || y < 0 || y >= gridHeight) return;
        if (!colorLookup[color]) {
          colorLookup[color] = parseColorToRgb(color);
        }
        const [r, g, b] = colorLookup[color];
        imageData.data[(y * gridWidth + x) * 4] = r;
        imageData.data[(y * gridWidth + x) * 4 + 1] = g;
        imageData.data[(y * gridWidth + x) * 4 + 2] = b;
        imageData.data[(y * gridWidth + x) * 4 + 3] = 0xff;
      }
      function getParticle(x, y) {
        if (x >= 0 && x < gridWidth && y >= 0 && y < gridHeight) {
          return grid[x][y];
        }
      }
      function isParticle(x, y, type) {
        const particle = getParticle(x, y);
        if (Array.isArray(type)) {
          return type.includes(particle?._type);
        } else {
          return particle?._type == type;
        }
      }
      function placeParticle(x, y, particle) {
        let p;
        if (x >= 0 && x < gridWidth) {
          if (y >= 0 && y < gridHeight) {
            if (!getParticle(x, y)) {
              p = particle || new currentMaterial(x, y, grid);
              p.wake();
              p.render();
              grid[x][y] = p;
            }
          }
        }
        return p;
      }
      function removeParticle(x, y) {
        if (x >= 0 && x < gridWidth) {
          if (y >= 0 && y < gridHeight) {
            const particle = grid[x][y];
            activeParticles.delete(particle);
            paintPixel(x, y, "black");
            grid[x][y] = null;
            wakeNeighbors(x, y);
          }
        }
      }
      function replaceParticle(x, y, newParticle) {
        removeParticle(x, y);
        placeParticle(x, y, newParticle);
      }
      function wakeNeighbors(cx, cy) {
        for (let x = cx - 1; x <= cx + 1; x++) {
          for (let y = cy - 1; y <= cy + 1; y++) {
            const particle = getParticle(x, y);
            if (particle) {
              particle.wake();
            }
          }
        }
      }
      function update() {
        tick++;
        let count = 0;
        activeParticles.forEach((particle) => {
          count++;
          particle.update();
        });
        activeParticles.forEach((particle) => {
          if (particle._remove) {
            removeParticle(particle._x, particle._y);
          }
        });
        ctx.putImageData(imageData, 0, 0);
        info.innerHTML = `Active particles: ${count}`;
      }

      const reactions = {};
      function createPair(particleType1, particleType2) {
        return (
          (particleType1?.ID ?? particleType1?.constructor.ID ?? 1) |
          (particleType2?.ID ?? particleType2?.constructor.ID ?? 1)
        );
      }
      function registerReaction(particleType1, particleType2, reaction) {
        reactions[createPair(particleType1, particleType2)] = reaction;
      }
      registerReaction(FireParticle, WaterParticle, {
        chance: 1000,
        result1: SmokeParticle,
        result2: SmokeParticle,
      });
      registerReaction(AcidParticle, SolidParticle, {
        chance: 100,
        result1: GasParticle,
        result2: GasParticle,
      });
      registerReaction(AcidParticle, WoodParticle, {
        chance: 100,
        result1: GasParticle,
        result2: GasParticle,
      });
      registerReaction(AcidParticle, SandParticle, {
        chance: 100,
        result1: GasParticle,
        result2: GasParticle,
      });
      registerReaction(AcidParticle, WaterParticle, {
        chance: 10,
        result1: WaterParticle,
        result2: WaterParticle,
      });
      registerReaction(FireParticle, WoodParticle, {
        chance: 50,
        result1: FireParticle,
        result2: FireParticle,
      });
      registerReaction(FireParticle, WaterParticle, {
        chance: 1000,
        result1: SmokeParticle,
        result2: SmokeParticle,
      });
      registerReaction(FireParticle, null, {
        chance: 10,
        result1: [SmokeParticle, 10],
      });
      registerReaction(GasParticle, null, {
        chance: 1,
      });
      registerReaction(SmokeParticle, null, {
        chance: 1,
      });
      registerReaction(AntsParticle, FireParticle, {
        chance: 1000,
      });
      registerReaction(AntsParticle, WaterParticle, {
        chance: 10,
        result1: WaterParticle,
      });
      registerReaction(AntsParticle, WoodParticle, {
        chance: 2,
        result1: AntsParticle,
      });
      registerReaction(FireParticle, GasParticle, {
        chance: 300,
        result1: FireParticle,
        result2: FireParticle,
      });
      registerReaction(GOLParticle, WoodParticle, {
        chance: 1000,
        result1: FireParticle,
        result2: FireParticle,
      });
      // BUGFIX: Lava+Water used to be handled inside the Lava update with a bug
      // (it converted the WATER into smoke and left the lava alone). Register it
      // as a proper reaction instead: lava cools into rock, water becomes steam.
      registerReaction(LavaParticle, WaterParticle, {
        chance: 300,
        result1: RockParticle,
        result2: SmokeParticle,
      });
      // Seeds burn like any other organic matter.
      registerReaction(FireParticle, SeedParticle, {
        chance: 400,
        result1: FireParticle,
        result2: FireParticle,
      });
      registerReaction(FireParticle, SproutParticle, {
        chance: 600,
        result1: FireParticle,
        result2: FireParticle,
      });
      function applyResult(particleClass, x, y) {
        if (typeof particleClass === "function") {
          replaceParticle(x, y, new particleClass(x, y, grid));
        } else if (Array.isArray(particleClass)) {
          if (randi(1, 100) <= particleClass[1]) {
            replaceParticle(x, y, new particleClass[0](x, y, grid));
          } else {
            removeParticle(x, y);
          }
        } else {
          removeParticle(x, y);
        }
      }
      function react() {
        for (let x = 0; x < gridWidth; x++) {
          for (let y = 0; y < gridHeight; y++) {
            const particle1 = getParticle(x, y);
            if (!particle1) continue;
            for (let x2 = x - 1; x2 <= x + 1; x2++) {
              for (let y2 = y - 1; y2 <= y + 1; y2++) {
                if (x2 === x && y2 === y) continue;
                const particle2 = getParticle(x2, y2);
                // BUGFIX: a missing neighbor was given ID 1 before, so every
                // "with empty cell" rule (key = own ID | 1) also fired against
                // ANY real particle whose ID already contained that bit
                // (e.g. sand+smoke pairs ignited the "Fire+empty" smoke rule).
                // Empty-cell rules now only trigger for genuinely empty cells.
                const isEmptyCell = !particle2;
                const reactionKey = isEmptyCell
                  ? createPair(particle1, null)
                  : createPair(particle1, particle2);
                const reaction = reactions[reactionKey];
                if (!reaction) continue;
                if (randi(1, 1000) > reaction.chance) continue;
                // BUGFIX: result2 used to be applied at (x, y) – overwriting the
                // result just placed at (x, y) by result1 – instead of at the
                // neighbor position (x2, y2).
                applyResult(reaction.result1, x, y);
                if (reaction.result2 !== undefined) {
                  applyResult(reaction.result2, x2, y2);
                } else if (!isEmptyCell) {
                  removeParticle(x2, y2);
                }
              }
            }
          }
        }
      }

      let lastUpdate = Date.now();
      function gameLoop() {
        if (mouse.isDown) {
          drawLine(
            mouse.prevX,
            mouse.prevY,
            mouse.x,
            mouse.y,
            brushWidth,
            mouse.button == 0 ? placeParticle : removeParticle
          );
          mouse.prevX = mouse.x;
          mouse.prevY = mouse.y;
          // BUGFIX: painting while the simulation is paused used to be invisible
          // until the next tick; flush the buffer right after painting.
          ctx.putImageData(imageData, 0, 0);
        }
        if (!paused && Date.now() - lastUpdate >= 1000 / updateFrequency) {
          lastUpdate = Date.now();
          update();
          react();
        }
        requestAnimationFrame(gameLoop);
      }
      requestAnimationFrame(gameLoop);

      // НОВЫЙ МАТЕРИАЛ "Seed" доступен сразу; подсвечиваем выбранный по умолчанию.
      document
        .querySelector(".materials__buttons button")
        ?.classList.add("materials__buttons--selected");
    </script>
  </body>
</html>
